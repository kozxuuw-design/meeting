
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свидание с Тёмой ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd1e3, #ffeaf2);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: #b91c59;
}

.card {
    background: rgba(255, 255, 255, 0.94);
    padding: 35px 25px;
    border-radius: 30px;
    box-shadow: 0 15px 45px #e96a9540;
    text-align: center;
    width: 90%;
    max-width: 440px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 27px;
    line-height: 1.4;
}

p {
    font-size: 17px;
}

.big-heart {
    font-size: 75px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
    min-height: 55px;
}

button {
    border: none;
    padding: 14px 30px;
    border-radius: 25px;
    font-size: 17px;
    cursor: pointer;
    transition: transform 0.2s;
}

.yes {
    color: white;
    background: #ff4081;
    box-shadow: 0 5px 15px #ff408155;
}

.yes:hover {
    transform: scale(1.08);
}

.yes:disabled {
    opacity: 0.6;
    cursor: wait;
}

.no {
    color: #777;
    background: #eeeeee;
    position: relative;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ffc1d6;
    border-radius: 15px;
    font-size: 16px;
    margin: 9px 0 18px;
    background: #fff7fa;
    color: #b91c59;
}

label {
    display: block;
    text-align: left;
    font-weight: bold;
}

.hidden {
    display: none;
}

.floating-heart {
    position: fixed;
    bottom: -40px;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(30deg);
        opacity: 0;
    }
}

.summary {
    line-height: 1.9;
    background: #fff0f5;
    padding: 15px;
    border-radius: 20px;
    overflow-wrap: anywhere;
}

#errorMessage {
    color: #d62855;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- Первое окно -->
<div class="card" id="invitation">
    <div class="big-heart">❤️</div>

    <h1>
        Любимый мой бывший,<br>
        сходите со мной на свидание? 🥺💗
    </h1>

    <p>Я была бы рада провести с тобой еще один день</p>

    <div class="buttons">
        <button class="yes" onclick="sayYes()">
            Да ❤️
        </button>

        <button class="no" id="noButton">
            Нет 🙄
        </button>
    </div>
</div>

<!-- Выбор свидания -->
<div class="card hidden" id="datePage">
    <div class="big-heart">💌</div>

    <h1>Урааа! Это свидание! 💕</h1>

    <p>Теперь выбери, когда и где мы увидимся.</p>

    <form id="dateForm">

        <label for="date">📅 Дата свидания</label>
        <input type="date" id="date" required>

        <label for="time">🕒 Время встречи</label>
        <input type="time" id="time" required>

        <label for="place">📍 Место встречи</label>
        <input
            type="text"
            id="place"
            placeholder="Где встретимся? 💗"
            maxlength="200"
            required
        >

        <button class="yes" type="submit" id="submitButton">
            Подтвердить свидание ❤️
        </button>

        <p id="errorMessage"></p>

    </form>
</div>

<!-- Финальное окно -->
<div class="card hidden" id="finalPage">
    <div class="big-heart">💖</div>

    <h1>Целую, жду встречи 💋❤️</h1>

    <p>
        Спасибо пыска, надеюсь наше
        свидание тебе понравится
    </p>

    <div class="summary" id="summary"></div>

    <p>До скорой встречи, любимый! 💕</p>
</div>

<script>

// Получаем элементы
const noButton = document.getElementById("noButton");
const dateInput = document.getElementById("date");
const dateForm = document.getElementById("dateForm");
const submitButton = document.getElementById("submitButton");
const errorMessage = document.getElementById("errorMessage");

// Устанавливаем сегодняшнюю дату
const today = new Date();

const year = today.getFullYear();
const month = String(today.getMonth() + 1).padStart(2, "0");
const day = String(today.getDate()).padStart(2, "0");

dateInput.min = `${year}-${month}-${day}`;

// Кнопка "Нет" убегает
function moveNo() {
    noButton.style.position = "fixed";

    const maxX = window.innerWidth - noButton.offsetWidth - 10;
    const maxY = window.innerHeight - noButton.offsetHeight - 10;

    noButton.style.left =
        Math.max(0, Math.random() * maxX) + "px";

    noButton.style.top =
        Math.max(0, Math.random() * maxY) + "px";
}

noButton.addEventListener("mouseenter", moveNo);

noButton.addEventListener("click", function(event) {
    event.preventDefault();
    moveNo();
});

// Нажатие "Да"
function sayYes() {
    document.getElementById("invitation").classList.add("hidden");

    noButton.classList.add("hidden");

    document.getElementById("datePage").classList.remove("hidden");
}

// Подтверждение свидания
dateForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const date = dateInput.value;
    const time = document.getElementById("time").value;
    const place = document.getElementById("place").value.trim();

    if (!date || !time || !place) {
        errorMessage.textContent = "Заполни все поля ❤️";
        return;
    }

    errorMessage.textContent = "";

    submitButton.disabled = true;
    submitButton.textContent = "Отправляем 💌";

    try {
        // Отправка данных на Python-сервер
        const response = await fetch("/api/date", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                date: date,
                time: time,
                place: place
            })
        });

        if (!response.ok) {
            throw new Error("Не удалось отправить уведомление");
        }

        // Красиво оформляем дату
        const formattedDate = new Date(
            date + "T12:00:00"
        ).toLocaleDateString("ru-RU", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

        // Показываем финальное окно
        document.getElementById("datePage").classList.add("hidden");
        document.getElementById("finalPage").classList.remove("hidden");

        const summary = document.getElementById("summary");
        summary.replaceChildren();

        const details = [
            "📅 " + formattedDate,
            "🕒 " + time,
            "📍 " + place
        ];

        details.forEach(function(detail) {
            const line = document.createElement("div");
            line.textContent = detail;
            summary.appendChild(line);
        });

        // Дополнительные сердечки
        for (let i = 0; i < 30; i++) {
            setTimeout(createHeart, i * 100);
        }

    } catch (error) {
        errorMessage.textContent =
            "Не получилось отправить ответ 💔 Попробуй ещё раз.";
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Подтвердить свидание ❤️";
    }
});

// Летающие сердечки
function createHeart() {
    const heart = document.createElement("div");

    heart.className = "floating-heart";

    const symbols = ["❤️", "💕", "💗", "💖", "💘"];

    heart.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 350);

</script>

</body>
</html>
